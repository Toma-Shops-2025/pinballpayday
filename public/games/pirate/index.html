<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pirate Adventure Pinball</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; background-image: url('https://images.unsplash.com/photo-1559128010-7c1ad6e1b6a5?auto=format&fit=crop&q=80&w=1000'); background-size: cover; background-position: center; }
        canvas { display: block; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        #hud { position: absolute; top: 40px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        .label { color: #94a3b8; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .value { color: #fbbf24; font-size: 24px; font-weight: 900; font-style: italic; }
        #instructions { position: absolute; bottom: 120px; width: 100%; text-align: center; color: white; opacity: 0.5; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="stat">
                <div class="label">Doubloons</div>
                <div id="score" class="value">0</div>
            </div>
            <div class="stat">
                <div class="label">Cannonballs</div>
                <div id="balls" class="value">3</div>
            </div>
        </div>
        <div id="instructions">TAP LEFT OR RIGHT TO FLIP</div>
    </div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Body, Events, Constraint, Composite } = Matter;

        const engine = Engine.create({ gravity: { x: 0, y: 1.5 } });
        const container = document.getElementById('game-container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        const render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: 'transparent'
            }
        });

        // Table Borders with "Metal" look
        const wallAttr = { isStatic: true, render: { fillStyle: '#1e293b', strokeStyle: '#334155', lineWidth: 4 } };
        const walls = [
            Bodies.rectangle(width/2, 0, width, 40, wallAttr),
            Bodies.rectangle(0, height/2, 40, height, wallAttr),
            Bodies.rectangle(width, height/2, 40, height, wallAttr),
            // Plunger Lane
            Bodies.rectangle(width - 40, height/2 + 100, 10, height, wallAttr),
            // Bottom Slopes
            Bodies.rectangle(width * 0.15, height - 120, width * 0.4, 20, { isStatic: true, angle: 0.6, ...wallAttr }),
            Bodies.rectangle(width * 0.75, height - 120, width * 0.4, 20, { isStatic: true, angle: -0.6, ...wallAttr })
        ];

        // Flippers - High detail
        function createFlipper(x, y, side) {
            const fWidth = 100;
            const fHeight = 25;
            const pivotX = side === 'left' ? x - 40 : x + 40;

            const flipper = Bodies.rectangle(x, y, fWidth, fHeight, {
                collisionFilter: { group: Body.nextGroup(true) },
                chamfer: { radius: 12 },
                render: { fillStyle: '#3b82f6', strokeStyle: '#fff', lineWidth: 2 },
                label: side + 'Flipper'
            });

            const pivot = Bodies.circle(pivotX, y, 5, { isStatic: true, isSensor: true, render: { visible: false } });

            const constraint = Constraint.create({
                bodyA: flipper,
                pointA: { x: side === 'left' ? -40 : 40, y: 0 },
                bodyB: pivot,
                length: 0,
                stiffness: 1
            });

            return { flipper, pivot, constraint };
        }

        const leftF = createFlipper(width * 0.32, height - 80, 'left');
        const rightF = createFlipper(width * 0.58, height - 80, 'right');

        // Bumper Obstacles
        const bumpers = [
            Bodies.circle(width * 0.3, height * 0.3, 35, { isStatic: true, restitution: 2, label: 'bumper', render: { fillStyle: '#ef4444', strokeStyle: '#fff', lineWidth: 5 } }),
            Bodies.circle(width * 0.7, height * 0.3, 35, { isStatic: true, restitution: 2, label: 'bumper', render: { fillStyle: '#ef4444', strokeStyle: '#fff', lineWidth: 5 } }),
            Bodies.circle(width * 0.5, height * 0.18, 40, { isStatic: true, restitution: 2.5, label: 'bumper', render: { fillStyle: '#fbbf24', strokeStyle: '#fff', lineWidth: 5 } }),
            // Dead Zones
            Bodies.rectangle(width * 0.2, height * 0.5, 60, 10, { isStatic: true, angle: 0.5, label: 'bumper', render: { fillStyle: '#10b981' } }),
            Bodies.rectangle(width * 0.8, height * 0.5, 60, 10, { isStatic: true, angle: -0.5, label: 'bumper', render: { fillStyle: '#10b981' } })
        ];

        const drain = Bodies.rectangle(width/2, height + 100, width, 50, { isStatic: true, isSensor: true, label: 'drain' });

        World.add(engine.world, [...walls, leftF.flipper, leftF.pivot, leftF.constraint, rightF.flipper, rightF.pivot, rightF.constraint, ...bumpers, drain]);

        let score = 0;
        let balls = 3;

        function spawnBall() {
            const ball = Bodies.circle(width - 22, height - 60, 14, {
                restitution: 0.5,
                density: 0.01,
                friction: 0.01,
                label: 'ball',
                render: { fillStyle: '#e2e8f0', strokeStyle: '#94a3b8', lineWidth: 2 }
            });
            World.add(engine.world, ball);
            // Launch force
            setTimeout(() => {
                Body.applyForce(ball, ball.position, { x: 0, y: -0.5 });
            }, 500);
        }

        spawnBall();

        // Control Logic
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            if (touchX < width/2) (leftF.flipper).isActive = true;
            else (rightF.flipper).isActive = true;
        });

        window.addEventListener('touchend', (e) => {
            e.preventDefault();
            leftF.flipper.isActive = false;
            rightF.flipper.isActive = false;
        });

        Events.on(engine, 'beforeUpdate', () => {
            if (leftF.flipper.isActive) Body.setAngle(leftF.flipper, -0.5);
            else Body.setAngle(leftF.flipper, 0.3);

            if (rightF.flipper.isActive) Body.setAngle(rightF.flipper, 0.5);
            else Body.setAngle(rightF.flipper, -0.3);
        });

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if (pair.bodyA.label === 'bumper' || pair.bodyB.label === 'bumper') {
                    score += 5000;
                    document.getElementById('score').innerText = score.toLocaleString();
                }
                if (pair.bodyA.label === 'drain' || pair.bodyB.label === 'drain') {
                    const ball = pair.bodyA.label === 'ball' ? pair.bodyA : pair.bodyB;
                    World.remove(engine.world, ball);
                    balls--;
                    document.getElementById('balls').innerText = balls;

                    if (balls <= 0) {
                        window.parent.postMessage({ type: "GAME_OVER", score: score }, "*");
                    } else {
                        setTimeout(spawnBall, 1000);
                    }
                }
            });
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
