<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pirate Pinball Test</title>
    <style>
        body { background: #0c4a6e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .btn { background: #f59e0b; color: #451a03; border: none; padding: 20px 40px; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 0 #b45309; }
        .btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #b45309; }
        h1 { margin-bottom: 0; font-style: italic; }
        p { opacity: 0.7; }
    </style>
</head>
<body>
    <h1 id="title">FAIR WIND</h1>
    <p>Placeholder Game Engine</p>
    <div style="font-size: 48px; font-weight: 900;" id="scoreDisplay">0</div>
    <button class="btn" onclick="addScore()">HIT BUMPER!</button>
    <button class="btn" style="background: #ef4444; box-shadow: 0 10px 0 #991b1b; color: white;" onclick="endGame()">DRAIN BALL</button>

    <script>
        let score = 0;
        function addScore() {
            score += 10000;
            document.getElementById('scoreDisplay').innerText = score.toLocaleString();
        }
        function endGame() {
            // THE BRIDGE: Send score to the main app
            window.parent.postMessage({ type: "GAME_OVER", score: score }, "*");
        }
    </script>
</body>
</html>
