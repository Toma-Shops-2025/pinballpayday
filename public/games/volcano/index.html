<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Volcano Pinball</title><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script><style>body { margin: 0; padding: 0; background: #450a0a; overflow: hidden; font-family: sans-serif; } canvas { display: block; width: 100vw; height: 100vh; } #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #f97316; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px #7f1d1d; }</style></head><body><div id="ui">HEAT: 0</div><script>const { Engine, Render, Runner, World, Bodies, Body, Events, Constraint } = Matter; const engine = Engine.create({ gravity: { x: 0, y: 1.8 } }); const render = Render.create({ element: document.body, engine: engine, options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: 'transparent' } }); const w = window.innerWidth; const h = window.innerHeight; World.add(engine.world, [Bodies.rectangle(w/2, 0, w, 40, {isStatic:true}), Bodies.rectangle(0, h/2, 40, h, {isStatic:true}), Bodies.rectangle(w, h/2, 40, h, {isStatic:true})]); function createFlipper(x, y, side) { const f = Bodies.rectangle(x, y, 90, 20, { chamfer: { radius: 10 }, render: { fillStyle: '#b91c1c' } }); const p = Bodies.circle(side === 'left' ? x-35 : x+35, y, 5, { isStatic: true, isSensor: true, render: { visible: false } }); const c = Constraint.create({ bodyA: f, pointA: { x: side === 'left' ? -35 : 35, y: 0 }, bodyB: p, length: 0, stiffness: 0.9 }); return { f, p, c }; } const l = createFlipper(w*0.35, h-50, 'left'); const r = createFlipper(w*0.65, h-50, 'right'); World.add(engine.world, [l.f, l.p, l.c, r.f, r.p, r.c]); const b = [Bodies.circle(w*0.5, h*0.3, 40, { isStatic: true, label: 'bumper', restitution: 2.5, render: { fillStyle: '#f97316' } })]; World.add(engine.world, b); const d = Bodies.rectangle(w/2, h+50, w, 100, { isStatic: true, isSensor: true, label: 'drain' }); World.add(engine.world, d); let s = 0; let ba = 3; function spawn() { const ball = Bodies.circle(w-50, h-100, 12, { restitution: 0.5, label: 'ball', render: { fillStyle: '#fef3c7' } }); World.add(engine.world, ball); Body.applyForce(ball, ball.position, { x: 0, y: -0.08 }); } spawn(); window.addEventListener('touchstart', (e) => { if (e.touches[0].clientX < w/2) Body.setAngularVelocity(l.f, -0.5); else Body.setAngularVelocity(r.f, 0.5); }); Events.on(engine, 'collisionStart', (event) => { event.pairs.forEach(p => { if (p.bodyA.label === 'bumper' || p.bodyB.label === 'bumper') { s += 2500; document.getElementById('ui').innerText = 'HEAT: ' + s; } if (p.bodyA.label === 'drain' || p.bodyB.label === 'drain') { ba--; if (ba <= 0) window.parent.postMessage({ type: "GAME_OVER", score: s }, "*"); else spawn(); } }); }); Render.run(render); Runner.run(Runner.create(), engine);</script></body></html>
