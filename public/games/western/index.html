<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wild West Pinball</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #2a1b0a; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #game-container { position: relative; width: 100vw; height: 100vh; background-image: url('https://images.unsplash.com/photo-1533134486753-c81769482274?auto=format&fit=crop&q=80&w=1000'); background-size: cover; background-position: center; }
        canvas { display: block; filter: sepia(0.3) contrast(1.2); }
        #hud { position: absolute; top: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .stat { background: rgba(69, 26, 3, 0.85); padding: 10px 40px; border-radius: 5px; border: 3px solid #b45309; }
        .label { color: #fcd34d; font-size: 12px; font-weight: bold; text-transform: uppercase; text-align: center; }
        .value { color: #fff; font-size: 32px; font-weight: 900; text-shadow: 2px 2px #000; }
        #balls-indicator { position: absolute; top: 120px; color: #fb923c; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="stat">
                <div class="label">WANTED BOUNTY</div>
                <div id="score" class="value">$0</div>
            </div>
            <div id="balls-indicator">REMAINING BULLETS: <span id="balls">3</span></div>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Body, Events, Constraint } = Matter;

        const engine = Engine.create({ gravity: { x: 0, y: 1.8 } }); // Faster physics for the West
        const width = window.innerWidth;
        const height = window.innerHeight;

        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: { width, height, wireframes: false, background: 'transparent' }
        });

        // Wood-textured Walls
        const woodAttr = { isStatic: true, render: { fillStyle: '#78350f', strokeStyle: '#451a03', lineWidth: 4 } };
        const walls = [
            Bodies.rectangle(width/2, 0, width, 40, woodAttr),
            Bodies.rectangle(0, height/2, 40, height, woodAttr),
            Bodies.rectangle(width, height/2, 40, height, woodAttr),
            // Bottom funnels
            Bodies.rectangle(width * 0.1, height - 150, width * 0.5, 30, { isStatic: true, angle: 0.7, ...woodAttr }),
            Bodies.rectangle(width * 0.9, height - 150, width * 0.5, 30, { isStatic: true, angle: -0.7, ...woodAttr })
        ];

        // Flippers
        function createFlipper(x, y, side) {
            const flipper = Bodies.rectangle(x, y, 95, 28, {
                chamfer: { radius: 10 },
                render: { fillStyle: '#fb923c', strokeStyle: '#fff', lineWidth: 2 }
            });
            const pivot = Bodies.circle(side === 'left' ? x - 40 : x + 40, y, 5, { isStatic: true, isSensor: true, render: { visible: false } });
            const constraint = Constraint.create({ bodyA: flipper, pointA: { x: side === 'left' ? -40 : 40, y: 0 }, bodyB: pivot, length: 0, stiffness: 1 });
            return { flipper, pivot, constraint };
        }

        const leftF = createFlipper(width * 0.32, height - 100, 'left');
        const rightF = createFlipper(width * 0.58, height - 100, 'right');

        // Cowboy Star Bumpers
        const bumpers = [
            Bodies.polygon(width * 0.5, height * 0.35, 5, 45, { isStatic: true, restitution: 2.2, label: 'bumper', render: { fillStyle: '#facc15', strokeStyle: '#b45309', lineWidth: 6 } }),
            Bodies.circle(width * 0.25, height * 0.2, 30, { isStatic: true, restitution: 1.8, label: 'bumper', render: { fillStyle: '#b45309' } }),
            Bodies.circle(width * 0.75, height * 0.2, 30, { isStatic: true, restitution: 1.8, label: 'bumper', render: { fillStyle: '#b45309' } })
        ];

        const drain = Bodies.rectangle(width/2, height + 100, width, 50, { isStatic: true, isSensor: true, label: 'drain' });

        World.add(engine.world, [...walls, leftF.flipper, leftF.pivot, leftF.constraint, rightF.flipper, rightF.pivot, rightF.constraint, ...bumpers, drain]);

        let score = 0;
        let balls = 3;

        function spawnBall() {
            const ball = Bodies.circle(width/2, 100, 14, {
                restitution: 0.6,
                label: 'ball',
                render: { fillStyle: '#f3f4f6', strokeStyle: '#94a3b8', lineWidth: 2 }
            });
            World.add(engine.world, ball);
        }

        spawnBall();

        window.addEventListener('touchstart', (e) => {
            const touchX = e.touches[0].clientX;
            if (touchX < width/2) leftF.flipper.isActive = true;
            else rightF.flipper.isActive = true;
        });

        window.addEventListener('touchend', () => {
            leftF.flipper.isActive = false;
            rightF.flipper.isActive = false;
        });

        Events.on(engine, 'beforeUpdate', () => {
            if (leftF.flipper.isActive) Body.setAngle(leftF.flipper, -0.6);
            else Body.setAngle(leftF.flipper, 0.4);

            if (rightF.flipper.isActive) Body.setAngle(rightF.flipper, 0.6);
            else Body.setAngle(rightF.flipper, -0.4);
        });

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if (pair.bodyA.label === 'bumper' || pair.bodyB.label === 'bumper') {
                    score += 7500;
                    document.getElementById('score').innerText = '$' + score.toLocaleString();
                }
                if (pair.bodyA.label === 'drain' || pair.bodyB.label === 'drain') {
                    const ball = pair.bodyA.label === 'ball' ? pair.bodyA : pair.bodyB;
                    World.remove(engine.world, ball);
                    balls--;
                    document.getElementById('balls').innerText = balls;
                    if (balls <= 0) {
                        window.parent.postMessage({ type: "GAME_OVER", score: score }, "*");
                    } else {
                        setTimeout(spawnBall, 1000);
                    }
                }
            });
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);
    </script>
</body>
</html>
